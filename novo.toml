[package]
name        = "tftp-nv"
version     = "0.1.0"
description = "TFTP for novo-lang: the five packets of RFC 1350 and the option packet of RFC 2347, built and read in a caller's buffer, and the lock-step transfer as a step a caller drives with a timer, for a client or a server, with blksize, timeout and tsize negotiated. No sockets and no allocation."
license     = "Apache-2.0"
stability   = "experimental"
category    = "networking"
layer       = "core"
tags        = ["tftp", "rfc1350", "rfc2347", "rfc2348", "rfc2349", "bootloader", "firmware", "embedded", "sans-io", "no-alloc"]
repository  = "https://github.com/novolang/tftp-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.23.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A TFTP transfer as a step the caller drives, for a bootloader with no heap"

[dependencies]
# None.  A packet is bytes in a buffer the caller owns, and the transfer is
# integers; nothing here needs another package.
